<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sfunio</title>
  <meta name="description" content="A modern international content studio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --gold: #d8b78f;
      --gold-bright: #ecd2ad;
      --grey: #6f6f6f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--gold);
      font-family: 'Cormorant Garamond', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px 0;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
      max-width: 640px;
      width: 100%;
    }

    .logo {
      width: 100%;
      max-width: 520px;
      height: auto;
      display: block;
    }

    .tagline {
      font-size: clamp(1.25rem, 3.4vw, 1.7rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--gold);
      line-height: 1.4;
    }

    .contact {
      display: inline-block;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(0.95rem, 2.4vw, 1.1rem);
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--gold);
      border: 1px solid rgba(216, 183, 143, 0.55);
      padding: 13px 40px 13px 44px;
      border-radius: 2px;
      transition: color 0.3s ease, border-color 0.3s ease, background-color 0.3s ease;
    }

    .contact:hover,
    .contact:focus-visible {
      color: var(--gold-bright);
      border-color: var(--gold-bright);
      background-color: rgba(216, 183, 143, 0.07);
      outline: none;
    }

    .contact:focus-visible {
      outline: 2px solid var(--gold-bright);
      outline-offset: 3px;
    }

    footer {
      width: 100%;
      padding: 40px 16px 28px;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: var(--grey);
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    @media (prefers-reduced-motion: reduce) {
      .contact { transition: none; }
    }
  </style>
</head>
